<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>넷볼 스코어보드 Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .center-pass-active {
            border-color: #f59e0b !important;
            background-color: #78350f !important;
            color: #fef3c7 !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between">

    <!-- 상단 헤더 & 컨트롤 유틸리티 -->
    <header class="flex justify-between items-center mb-2">
        <div class="flex gap-2">
            <button onclick="toggleFullScreen()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 border border-slate-700 shadow">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
                전체화면
            </button>
            <a href="index.html" class="bg-indigo-900 hover:bg-indigo-800 text-indigo-100 px-3 py-1.5 rounded-lg text-xs font-bold transition border border-indigo-700 shadow flex items-center gap-1">
                📅 리그 메인으로
            </a>
            <button onclick="fetchMatchRoster()" class="bg-purple-900 hover:bg-purple-800 text-purple-100 px-3 py-1.5 rounded-lg text-xs font-bold transition border border-purple-700 shadow flex items-center gap-1">
                👥 출전 명단 불러오기
            </button>
        </div>

        <div class="flex items-center gap-2">
            <span class="text-xs text-slate-400 font-bold">시간설정</span>
            <input type="number" id="time-input" value="12" class="w-12 bg-slate-800 border border-slate-700 text-center text-xs text-amber-400 font-bold py-1 rounded">
            <span class="text-xs text-slate-400">분</span>
            <button onclick="applyTimerSetting()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-2 py-1 rounded">적용</button>
        </div>
    </header>

    <!-- 쿼터 제어 및 타이머 표시 -->
    <main class="flex-grow flex flex-col items-center justify-start">
        <div class="flex items-center justify-center gap-6 mb-1">
            <button onclick="prevQuarter()" class="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 hover:bg-slate-700 flex items-center justify-center text-amber-400 font-black text-xl shadow transition">&lt;</button>
            <h1 id="quarter-display" class="text-4xl md:text-5xl font-black text-amber-400 tracking-wider drop-shadow-md">1 Quarter</h1>
            <button onclick="nextQuarter()" class="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 hover:bg-slate-700 flex items-center justify-center text-amber-400 font-black text-xl shadow transition">&gt;</button>
        </div>
        <p class="text-xs text-slate-400 font-bold mb-4 tracking-widest">2026학년도 2학기 3학년 넷볼 스코어보드 Pro</p>

        <!-- 타이머 -->
        <div class="relative flex items-center justify-center mb-6">
            <div class="flex flex-col gap-2 mr-6">
                <button onclick="adjustTime(1)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 p-2 rounded-lg text-xs">▲</button>
                <button onclick="adjustTime(-1)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 p-2 rounded-lg text-xs">▼</button>
            </div>
            <div id="timer-display" class="text-7xl md:text-9xl font-black font-mono tracking-tighter text-white drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]">12:00</div>
            <div class="flex flex-col gap-2 ml-6">
                <button onclick="adjustTime(1)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 p-2 rounded-lg text-xs">▲</button>
                <button onclick="adjustTime(-1)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 p-2 rounded-lg text-xs">▼</button>
            </div>
        </div>

        <!-- 팀 점수 및 센터패스 스코어보드 -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 w-full max-w-6xl items-stretch">
            
            <!-- A팀 (좌측) -->
            <div class="md:col-span-5 bg-slate-900 border-2 border-red-600/60 rounded-2xl p-4 flex flex-col justify-between shadow-2xl relative overflow-hidden">
                <div class="text-center">
                    <div class="flex justify-center gap-2 mb-1">
                        <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                        <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
                        <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
                        <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                    </div>
                    <h2 id="team-A-name" class="text-3xl font-black text-red-400 mb-1">1반</h2>
                    <span id="warn-A-badge" class="bg-amber-900/60 text-amber-300 border border-amber-600/50 text-xs px-2.5 py-0.5 rounded-full font-bold">팀 경고 수: 0</span>
                </div>

                <div class="my-4 text-center">
                    <span id="score-A" class="text-8xl font-black text-white drop-shadow-md">0</span>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="changeScore('A', -1)" class="bg-red-950 hover:bg-red-900 text-red-200 border border-red-800/80 font-black text-2xl py-3 rounded-xl shadow">-</button>
                    <button onclick="changeScore('A', 1)" class="bg-red-600 hover:bg-red-500 text-white font-black text-2xl py-3 rounded-xl shadow">+</button>
                </div>
                <button id="cp-A" onclick="setCenterPass('A')" class="w-full mt-3 bg-slate-800 border-2 border-slate-600 text-slate-400 py-3 rounded-xl font-black text-lg transition uppercase tracking-widest flex items-center justify-center">Center Pass</button>
            </div>

            <!-- 중앙 컨트롤 버튼 -->
            <div class="md:col-span-2 flex flex-col justify-center gap-2.5 px-2">
                <button id="btn-start" onclick="toggleTimer()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xl py-3 rounded-xl shadow-lg transition">시작</button>
                <button onclick="saveResultToSheet()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm py-2.5 rounded-xl shadow transition">💾 리그 시트 저장</button>
                <button onclick="resetTimer()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-xs py-2 rounded-lg border border-slate-600 shadow">시간 초기화</button>
                <button onclick="resetScores()" class="w-full bg-rose-900/60 hover:bg-rose-800 text-rose-200 font-bold text-xs py-2 rounded-lg border border-rose-700/50 shadow">점수 초기화</button>
            </div>

            <!-- B팀 (우측) -->
            <div class="md:col-span-5 bg-slate-900 border-2 border-blue-600/60 rounded-2xl p-4 flex flex-col justify-between shadow-2xl relative overflow-hidden">
                <div class="text-center">
                    <div class="flex justify-center gap-2 mb-1">
                        <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                        <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
                        <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
                        <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                    </div>
                    <h2 id="team-B-name" class="text-3xl font-black text-blue-400 mb-1">2반</h2>
                    <span id="warn-B-badge" class="bg-amber-900/60 text-amber-300 border border-amber-600/50 text-xs px-2.5 py-0.5 rounded-full font-bold">팀 경고 수: 0</span>
                </div>

                <div class="my-4 text-center">
                    <span id="score-B" class="text-8xl font-black text-white drop-shadow-md">0</span>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="changeScore('B', -1)" class="bg-blue-950 hover:bg-blue-900 text-blue-200 border border-blue-800/80 font-black text-2xl py-3 rounded-xl shadow">-</button>
                    <button onclick="changeScore('B', 1)" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-2xl py-3 rounded-xl shadow">+</button>
                </div>
                <button id="cp-B" onclick="setCenterPass('B')" class="w-full mt-3 bg-slate-800 border-2 border-slate-600 text-slate-400 py-3 rounded-xl font-black text-lg transition uppercase tracking-widest flex items-center justify-center">Center Pass</button>
            </div>

        </div>
    </main>

    <!-- 스크립트 로직 -->
    <script>
        let currentQuarter = 1;
        let isRunning = false;
        let timerInterval = null;
        let timeRemaining = 12 * 60;
        let centerPassTeam = 'A';
        let scores = { A: 0, B: 0 };

        // 쿼터 업데이트 함수
        function updateQuarterUI() {
            const qDisplay = document.getElementById('quarter-display');
            if (qDisplay) {
                qDisplay.innerText = `${currentQuarter} Quarter`;
            }
            resetTimer();
        }

        function nextQuarter() {
            currentQuarter++;
            if (currentQuarter > 4) currentQuarter = 1;
            updateQuarterUI();
        }

        function prevQuarter() {
            currentQuarter--;
            if (currentQuarter < 1) currentQuarter = 4;
            updateQuarterUI();
        }

        // 센터패스 UI 업데이트 함수
        function updateCenterPassDisplay() {
            const btnA = document.getElementById('cp-A');
            const btnB = document.getElementById('cp-B');
            if (!btnA || !btnB) return;
            
            btnA.className = 'w-full mt-3 bg-slate-800 border-2 border-slate-600 text-slate-400 py-3 rounded-xl font-black text-lg transition uppercase tracking-widest flex items-center justify-center';
            btnB.className = 'w-full mt-3 bg-slate-800 border-2 border-slate-600 text-slate-400 py-3 rounded-xl font-black text-lg transition uppercase tracking-widest flex items-center justify-center';
            btnA.innerHTML = 'Center Pass';
            btnB.innerHTML = 'Center Pass';

            const activeBtn = (centerPassTeam === 'A') ? btnA : btnB;
            if (activeBtn) {
                activeBtn.classList.add('center-pass-active');
                if (!isRunning && timeRemaining === (parseInt(document.getElementById('time-input').value) || 12) * 60 && currentQuarter <= 4) {
                    activeBtn.innerHTML = `CENTER PASS <span class="text-xs font-black bg-red-600 text-white px-2 py-0.5 rounded ml-2 animate-pulse">${currentQuarter}Q 시작</span>`;
                }
            }
        }

        function setCenterPass(team) {
            centerPassTeam = team;
            updateCenterPassDisplay();
        }

        // 타이머 관련 로직
        function updateTimerDisplay() {
            const mins = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
            const secs = String(timeRemaining % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `${mins}:${secs}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('btn-start');
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                btn.innerText = '시작';
                btn.className = 'w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xl py-3 rounded-xl shadow-lg transition';
            } else {
                isRunning = true;
                btn.innerText = '일시정지';
                btn.className = 'w-full bg-amber-600 hover:bg-amber-500 text-white font-black text-xl py-3 rounded-xl shadow-lg transition';
                timerInterval = setInterval(() => {
                    if (timeRemaining > 0) {
                        timeRemaining--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;
                        btn.innerText = '시작';
                        btn.className = 'w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xl py-3 rounded-xl shadow-lg transition';
                        alert(`${currentQuarter} 쿼터가 종료되었습니다!`);
                    }
                }, 1000);
            }
            updateCenterPassDisplay();
        }

        function resetTimer() { 
            clearInterval(timerInterval); 
            isRunning = false; 
            const btn = document.getElementById('btn-start');
            if (btn) {
                btn.innerText = '시작';
                btn.className = 'w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xl py-3 rounded-xl shadow-lg transition';
            }
            setTime(); 
            updateCenterPassDisplay(); 
        }

        function setTime() { 
            timeRemaining = (parseInt(document.getElementById('time-input').value) || 12) * 60; 
            updateTimerDisplay(); 
        }

        function applyTimerSetting() {
            resetTimer();
        }

        function adjustTime(amountMinutes) {
            timeRemaining = Math.max(0, timeRemaining + (amountMinutes * 60));
            updateTimerDisplay();
        }

        // 점수 변경 함수
        function changeScore(team, amount) {
            scores[team] = Math.max(0, scores[team] + amount);
            document.getElementById(`score-${team}`).innerText = scores[team];
            
            // 득점 시 상대팀에게 센터패스 전환
            if (amount > 0) {
                centerPassTeam = (team === 'A') ? 'B' : 'A';
                updateCenterPassDisplay();
            }
        }

        function resetScores() {
            scores.A = 0;
            scores.B = 0;
            document.getElementById('score-A').innerText = '0';
            document.getElementById('score-B').innerText = '0';
        }

        // 전체화면 토글
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => alert(err.message));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // 초기화 실행
        window.onload = function() {
            updateQuarterUI();
            updateCenterPassDisplay();
        };
    </script>
</body>
</html>
